
name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Verify OCR model assets
        shell: pwsh
        run: |
          $detector = "deepdoc_vietocr/onnx/det.onnx"
          $recognizer = "deepdoc_vietocr/vietocr/weight/vgg_seq2seq.pth"

          if (!(Test-Path $detector) -or !(Test-Path $recognizer)) {
            throw "Commit det.onnx and vgg_seq2seq.pth at the expected DeepDoc paths."
          }

          $detectorHash = (Get-FileHash $detector -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($detectorHash -ne "30a86f5731181461d08021402766601e4302a9b9b9666be8aff402696339cdff") {
            throw "det.onnx failed SHA-256 verification."
          }

          $recognizerHash = (Get-FileHash $recognizer -Algorithm MD5).Hash.ToLowerInvariant()
          if ($recognizerHash -ne "efcabaa6d3adfca8e52bda2fd7d2ee04") {
            throw "vgg_seq2seq.pth failed MD5 verification."
          }

      - name: Build executable
        shell: cmd
        run: build_windows.bat

      # Keep the existing downloadable workflow artifact
      - name: Upload portable app folder
        uses: actions/upload-artifact@v4
        with:
          name: DoiSoatHoSo-windows-x64-onedir
          path: dist/DoiSoatHoSo/
          if-no-files-found: error
          retention-days: 14

      # Package the application only when building a version tag
      - name: Package application for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "DoiSoatHoSo-$version-windows-x64.zip"

          Compress-Archive `
            -Path "dist/DoiSoatHoSo/*" `
            -DestinationPath $zipName `
            -CompressionLevel Optimal

      # Automatically create GitHub Release and attach ZIP
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DoiSoatHoSo ${{ github.ref_name }}
          generate_release_notes: true
          files: DoiSoatHoSo-${{ github.ref_name }}-windows-x64.zip
          fail_on_unmatched_files: true
